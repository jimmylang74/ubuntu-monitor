[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-power-monitor"
version = "0.1.0"
description = "Real-time CPU/GPU/system power monitoring for Ubuntu"
requires-python = ">=3.12"
dependencies = [
    "psutil>=6,<8",
    "nvidia-ml-py>=12.535",
    "PyYAML>=6.0",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "SQLAlchemy>=2.0,<3",
    "jinja2>=3.1,<4",
    "pymodbus>=3.6,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27,<1",
]

[project.scripts]
power-monitor = "app.cli:main"
power-monitor-web = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
